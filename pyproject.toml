[project]
name = "clinic-zero"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nourayman21k", email = "nour.ayman.fcis@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "arxiv<3",
    "faiss-cpu>=1.15.1",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.3",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp>=2.2.0",
    "open-alternative-jev[quant]",
    "pydantic>=2",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    "torch>=2.11.0",
    "wikipedia>=1.4.0",
]

[project.scripts]
clinic-zero = "clinic_zero:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "comm>=0.2.3",
    "ipykernel",
    "nbclient>=0.11.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
open-alternative-jev = { git = "https://github.com/ikermoel/open-alternative-jev" }
